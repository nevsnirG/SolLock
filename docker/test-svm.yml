# LiteSVM has no Windows build, so its tests run here on Linux.
# Only git-tracked files arrive, as a tar on stdin, so local keys never reach this container.
services:
  test-svm:
    image: node:24-bookworm-slim
    stdin_open: true
    volumes:
      - pnpm-store:/root/.local/share/pnpm/store
    command:
      - bash
      - -c
      - |
        set -e
        mkdir -p /work
        tar -xf - -C /work
        cd /work
        npm install -g pnpm@12.16.1 --silent
        pnpm install --frozen-lockfile --reporter=silent
        pnpm --filter @sollock/core test:svm
volumes:
  pnpm-store:
