# Checks the lockfile against the npm advisory database every week. A failing run emails the repository owner,
# which is the alert: CI itself does not run pnpm audit, so a registry hiccup cannot block a deploy.
name: Dependency audit

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Reads pnpm-lock.yaml only: nothing is installed or run.
      - run: pnpm audit --audit-level=high
