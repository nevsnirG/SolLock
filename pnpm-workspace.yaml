packages:
  - packages/*
  - web
  - worker
allowBuilds:
  esbuild: true
  workerd: true
# In minutes: a day's wait lets poisoned releases be pulled before they are installed.
minimumReleaseAge: 1440
# satori pins fflate 0.7.3, which has a known unzip bug (GHSA-px8p-9vwx-vf98); 0.7.5 is the fixed release of that line.
overrides:
  fflate@<0.7.5: '0.7.5'
